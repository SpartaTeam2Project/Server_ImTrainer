spring.application.name=trainer-game-server
spring.profiles.default=local

springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.default-produces-media-type=application/json

# 스키마는 Flyway(db/migration)가 만들고, Hibernate는 엔티티와 맞는지 검사만 합니다.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
# Flyway 도입 전부터 테이블이 있던 DB는 V1(초기 스키마)을 건너뛰고 V2부터 적용
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

jwt.secret=${JWT_SECRET}
jwt.access-token-seconds=1800
jwt.refresh-token-seconds=1209600
# 사용한 리프레시 토큰이 이 시간(초) 안에 다시 오면 동시 요청으로 보고 401만 반환.
# 이 시간이 지난 뒤 다시 오면 탈취로 보고 같은 로그인에서 나온 토큰을 모두 폐기
jwt.refresh-reuse-grace-seconds=10

# 로그인 시도 제한: 같은 IP+아이디로 5번 실패하면 15분 차단, 같은 IP에서 50번 실패하면 15분 차단
login.max-failures-per-account=5
login.max-failures-per-ip=50
login.block-seconds=900

# 웹 빌드(WebGL 등)에서 호출할 출처. 쉼표로 여러 개, 비우면 CORS 비활성화
# 예: CORS_ALLOWED_ORIGINS=https://game.example.com,http://localhost:5173
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

# 클라이언트 실제 IP를 읽을 헤더 (로그인 시도 제한용).
# CloudFront, ALB, Nginx 뒤에 두면 X-Forwarded-For. 프록시 없이 직접 받을 때는 비움 (헤더를 위조할 수 있으므로)
client-ip.header=${CLIENT_IP_HEADER:}

# Redis: 진행 중인 라운드의 시작 시각 저장. 배포 환경에서는 REDIS_HOST 를 넣어야 합니다.
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# 헬스 체크: /actuator/health 만 열고 응답은 {"status":"UP"} 만 (세부 정보 숨김)
management.endpoints.web.exposure.include=health

# ===== 라운드 결과 검증 기준값 (서버 전용, 클라에 내려주지 않음) =====
# 임시값입니다. 환경변수로 덮어쓸 수 있습니다 (예: ROUND_RULE_MAX_KILL_PER_SEC)
round.rule.time-tolerance-sec=3
round.rule.max-kill-per-sec=20
round.rule.max-exp-per-kill=30
round.rule.max-ball-per-kill=3
round.rule.max-dollar-per-kill=10
round.rule.max-exp-multiplier=2.0
round.rule.max-ball-multiplier=2.0
round.rule.max-dollar-multiplier=2.0
round.rule.rival-spawn-sec=600
round.rule.rival-exp=500
round.rule.rival-ball=50
round.rule.rival-dollar=100
round.rule.champion-spawn-sec=1198
round.rule.champion-exp=1500
round.rule.champion-ball=150
round.rule.champion-dollar=300
round.rule.exp-check-enabled=false
round.rule.entry-check-enabled=false
