# 클라에 내려가는 메시지 (응답의 message). 화면에 그대로 표시됩니다.
# 키 규칙
#   error.{ErrorCode}[.{상세}]  : ApiException / 하위 예외 (common/ErrorCode.java)
#   validation.{요청}.{필드}.{제약} : 요청 DTO 검증 어노테이션의 message = "{키}"
# {0}, {1}은 코드에서 넘긴 값입니다. 작은따옴표(')는 ''로 두 번 써야 합니다.

# ===== 공통 =====
error.INVALID_REQUEST=요청 값이 올바르지 않습니다.
error.INVALID_REQUEST.json=요청 본문(JSON) 형식이 올바르지 않습니다.
error.NOT_FOUND=요청한 API를 찾을 수 없습니다.
error.METHOD_NOT_ALLOWED=지원하지 않는 HTTP 메서드입니다.
error.UNSUPPORTED_MEDIA_TYPE=Content-Type은 application/json이어야 합니다.
error.INTERNAL_ERROR=일시적인 서버 오류가 발생했습니다. 잠시 후 다시 시도해 주세요.

# ===== 인증 =====
error.UNAUTHORIZED.login-failed=아이디 또는 비밀번호가 일치하지 않습니다.
error.UNAUTHORIZED.refresh-failed=리프레시 토큰이 유효하지 않거나 만료되었습니다. 다시 로그인해 주세요.
error.UNAUTHORIZED.no-token=액세스 토큰이 없습니다.
error.UNAUTHORIZED.invalid-token=액세스 토큰이 유효하지 않거나 만료되었습니다.
error.DUPLICATE_USERNAME=이미 사용 중인 아이디입니다.
# {0}: 남은 시간(분)
error.TOO_MANY_REQUESTS.login=로그인 시도가 너무 많습니다. {0}분 후 다시 시도해 주세요.

