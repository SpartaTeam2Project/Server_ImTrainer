name: CI/CD

on:
  push:
    branches: [YJ_2]   # 지금은 YJ_2 push에서만 실행 (팀 합의 후 dev 등 추가)

env:
  AWS_REGION: ap-northeast-2
  CONTAINER_NAME: imtrainer

jobs:
  # CI: 모든 push / PR에서 빌드가 되는지 확인
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build jar
        run: |
          chmod +x gradlew
          ./gradlew bootJar -x test   # 테스트는 DB/JWT_SECRET이 필요해 일단 제외

      - uses: actions/upload-artifact@v4
        with:
          name: app
          path: build/libs/app.jar
          retention-days: 3

  # Docker 이미지를 만들어 ECR에 push (main/dev push일 때만)
  push-image:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: app
          path: build/libs

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - id: meta
        name: Build and push image
        run: |
          IMAGE=${{ steps.ecr.outputs.registry }}/${{ secrets.ECR_REPOSITORY }}
          docker build -t $IMAGE:${{ github.sha }} -t $IMAGE:${{ github.ref_name }} .
          docker push $IMAGE:${{ github.sha }}
          docker push $IMAGE:${{ github.ref_name }}
          echo "image=$IMAGE:${{ github.sha }}" >> $GITHUB_OUTPUT

  # CD: dev 브랜치면 EC2에서 새 이미지로 컨테이너 교체
  deploy-dev:
    needs: push-image
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            IMAGE=${{ needs.push-image.outputs.image }}
            REGISTRY=${IMAGE%%/*}
            # EC2에 붙은 IAM Role 권한으로 ECR 로그인 (키 저장 불필요)
            aws ecr get-login-password --region ${{ env.AWS_REGION }} | docker login --username AWS --password-stdin $REGISTRY
            docker pull $IMAGE
            docker rm -f ${{ env.CONTAINER_NAME }} 2>/dev/null || true
            docker run -d --name ${{ env.CONTAINER_NAME }} \
              -p 8080:8080 \
              --env-file ~/app/app.env \
              --restart unless-stopped \
              $IMAGE
            for i in $(seq 1 30); do
              code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/auth/login || true)
              if [ "$code" != "000" ]; then echo "server is up ($code)"; docker image prune -af >/dev/null; exit 0; fi
              sleep 2
            done
            echo "server did not start"; docker logs --tail 50 ${{ env.CONTAINER_NAME }}; exit 1
