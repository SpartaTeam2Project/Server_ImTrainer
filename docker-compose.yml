# 로컬 개발용: 서버 + MySQL을 함께 띄웁니다.
# 실행 전: ./gradlew bootJar  (jar를 먼저 만들어야 이미지에 들어갑니다)
# 실행:    docker compose up --build
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: game
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "3307:3306"          # 기존 MySQL 컨테이너(3306)와 겹치지 않게 3307로 노출
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: .
    depends_on:
      mysql:
        condition: service_healthy   # MySQL이 준비된 뒤에 서버 시작
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: local
      # compose 안에서는 localhost가 아니라 서비스 이름(mysql)으로 접속
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/game?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      JWT_SECRET: ${JWT_SECRET}      # 같은 폴더의 .env 파일에서 읽음

volumes:
  mysql-data:
